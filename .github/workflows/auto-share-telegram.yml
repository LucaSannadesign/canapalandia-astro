name: Auto Share Telegram

on:
  schedule:
    - cron: '30 8 * * *'
  workflow_dispatch: # Permette esecuzione manuale
    inputs:
      mode:
        description: "Modalità di condivisione"
        required: true
        default: "repost"
        type: choice
        options:
          - new
          - repost

permissions:
  contents: read # Permessi minimi: solo read per checkout
  actions: write # Necessario per salvare cache

concurrency:
  group: auto-share-telegram
  cancel-in-progress: true

jobs:
  share:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore cache (state file)
        uses: actions/cache/restore@v4
        with:
          path: .cache/telegram-share.json
          key: auto-share-cache-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            auto-share-cache-

      - name: Run auto-share script
        env:
          RSS_URL: ${{ secrets.RSS_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
          STATE_FILE: .cache/telegram-share.json
          SHARE_MODE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode || 'repost' }}
          NEW_POST_WINDOW_HOURS: 48
        run: |
          # Crea directory se non esiste (dopo restore cache)
          mkdir -p .cache
          node scripts/auto-share-telegram.mjs

      - name: Save cache (state file)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/telegram-share.json
          key: auto-share-cache-${{ github.run_id }}-${{ github.run_attempt }}
