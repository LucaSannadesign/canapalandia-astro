name: Materialize CAN-260915 hero

on:
  push:
    branches:
      - fix/can-260915-hero-cache
    paths:
      - 'public/images/canapa-industriale-documenti-tracciabilita-seme-raccolto-v2.webp.b64'
      - '.github/workflows/materialize-can-260915-hero.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/can-260915-hero-cache
      - name: Decode approved hero robustly
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, re

          src = Path('public/images/canapa-industriale-documenti-tracciabilita-seme-raccolto-v2.webp.b64')
          dst = Path('public/images/canapa-industriale-documenti-tracciabilita-seme-raccolto-v2.webp')
          text = src.read_text()
          clean = ''.join(re.findall(r'[A-Za-z0-9+/=]', text))
          data = base64.b64decode(clean)
          assert data[:4] == b'RIFF' and data[8:12] == b'WEBP', 'not a valid WebP container'
          dst.write_bytes(data)
          print('bytes=', len(data))
          print('sha256=', hashlib.sha256(data).hexdigest())
          PY
      - name: Commit decoded binary hero
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/canapa-industriale-documenti-tracciabilita-seme-raccolto-v2.webp
          git diff --cached --quiet && exit 0
          git commit -m "fix(hero): materialize CAN-260915 approved image"
          git push origin HEAD:fix/can-260915-hero-cache
