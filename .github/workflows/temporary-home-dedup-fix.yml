name: Temporary home dedup patch

on:
  push:
    branches:
      - feat/can-260904-olio-semi-canapa

permissions:
  contents: write

jobs:
  patch-home:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/can-260904-olio-semi-canapa
          fetch-depth: 0

      - name: Patch homepage selection
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/pages/index.astro')
          text = path.read_text(encoding='utf-8')

          anchor = '''function take(n: number, ...sources: Post[][]): Post[] {
  return takeFrom(n, ...sources, recent, published);
}
'''
          replacement = '''function take(n: number, ...sources: Post[][]): Post[] {
  return takeFrom(n, ...sources, recent, published);
}

/**
 * Legge contenuti senza marcarli come già usati. Serve ai moduli di servizio
 * (ticker e Ultima ora), che possono ripetere una notizia già presente in una
 * sezione visuale senza sottrarla alla gerarchia editoriale principale.
 */
function peekFrom(n: number, ...sources: Post[][]): Post[] {
  const out: Post[] = [];
  const seen = new Set(used);
  for (const source of sources) {
    for (const post of source) {
      if (out.length >= n) return out;
      const key = getKey(post);
      if (!seen.has(key)) {
        seen.add(key);
        out.push(post);
      }
    }
  }
  return out;
}
'''

          old_selection = '''// 2. "In aggiornamento" (rotazione) e "Ultima ora": cronologia pura
const ticker = take(3);
const ultimaOra = take(3);
'''
          new_selection = '''// 2. "In aggiornamento" (rotazione) e "Ultima ora": cronologia pura.
// Sono moduli di servizio: non consumano i post destinati alle sezioni visuali.
const utilityChronology = peekFrom(6, recent, published);
const ticker = utilityChronology.slice(0, 3);
const ultimaOra = utilityChronology.slice(3, 6);
'''

          if 'function peekFrom(' not in text:
              if anchor not in text:
                  raise SystemExit('Anchor take() non trovato')
              text = text.replace(anchor, replacement, 1)

          if old_selection in text:
              text = text.replace(old_selection, new_selection, 1)
          elif new_selection not in text:
              raise SystemExit('Blocco ticker/ultimaOra non trovato')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet -- src/pages/index.astro; then
            echo "Nessuna modifica necessaria"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/index.astro
          git commit -m "fix: keep home utility feeds non-consuming"
          git push origin HEAD:feat/can-260904-olio-semi-canapa
