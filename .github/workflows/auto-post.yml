name: Auto Post Generation

on:
  schedule:
    - cron: '35 9 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Date (YYYY-MM-DD)'
        required: false
        type: string
      force:
        description: 'Force run (ignore time window)'
        required: false
        type: boolean
        default: false
      allow_test:
        description: 'Allow test posts (category=Test or tags include draft)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-post:
    runs-on: ubuntu-latest
    steps:
      - name: Validate GH_PAT token
        id: validate-token
        run: |
          # Verifica che GH_PAT sia configurato
          # Nota: GitHub Actions maschera i secrets nei log, quindi non possiamo verificare direttamente il valore
          # Verifichiamo invece se il secret è definito usando un test indiretto
          TOKEN_CHECK="${{ secrets.GH_PAT }}"
          
          # Se il secret non è configurato, GitHub Actions lo lascia vuoto
          # Usiamo un test che verifica se la stringa è vuota o contiene solo spazi
          if [ -z "${TOKEN_CHECK}" ] || [ "${TOKEN_CHECK}" = "" ]; then
            echo "::error::GH_PAT secret is missing or empty."
            echo "::error::"
            echo "::error::Please configure it in:"
            echo "::error::  GitHub Settings > Secrets and variables > Actions > Repository secrets"
            echo "::error::"
            echo "::error::Create a Personal Access Token (PAT) with 'repo' scope, or"
            echo "::error::use a fine-grained PAT with 'Contents: Read and write' and 'Pull requests: Write' permissions."
            echo "::error::"
            echo "::error::Add the token as a repository secret named 'GH_PAT'."
            exit 1
          fi
          
          echo "token_valid=true" >> $GITHUB_OUTPUT
          echo "✓ GH_PAT token is configured"

      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Detect package manager
        id: pkg-mgr
        run: |
          if [ -f "pnpm-lock.yaml" ]; then
            echo "manager=pnpm" >> $GITHUB_OUTPUT
            echo "install=pnpm install --frozen-lockfile" >> $GITHUB_OUTPUT
            echo "command=pnpm" >> $GITHUB_OUTPUT
          elif [ -f "yarn.lock" ]; then
            echo "manager=yarn" >> $GITHUB_OUTPUT
            echo "install=yarn install --frozen-lockfile" >> $GITHUB_OUTPUT
            echo "command=yarn" >> $GITHUB_OUTPUT
          else
            echo "manager=npm" >> $GITHUB_OUTPUT
            echo "install=npm ci" >> $GITHUB_OUTPUT
            echo "command=npm" >> $GITHUB_OUTPUT
          fi

      - name: Install dependencies
        run: ${{ steps.pkg-mgr.outputs.install }}

      - name: Compute meta
        id: meta
        run: |
          echo "today=$(date -u +%Y-%m-%d)" >> $GITHUB_OUTPUT
          echo "branch=auto-post/${{ github.run_id }}" >> $GITHUB_OUTPUT
          echo "iso=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT

      - name: Run auto-post script
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL_DEFAULT: ${{ vars.OPENAI_MODEL_DEFAULT || 'gpt-5-mini' }}
          OPENAI_MAX_OUTPUT_TOKENS: ${{ vars.OPENAI_MAX_OUTPUT_TOKENS || '7000' }}
        run: |
          # Costruisci argomenti basati sugli input del workflow
          args=""
          
          # --date: data specifica (YYYY-MM-DD)
          if [ -n "${{ github.event.inputs.date }}" ]; then
            args="$args --date ${{ github.event.inputs.date }}"
            echo "→ Using custom date: ${{ github.event.inputs.date }}"
          fi
          
          # --force: bypass finestra oraria Rome (10:30-11:00)
          if [ "${{ github.event.inputs.force }}" == "true" ]; then
            args="$args --force"
            echo "→ Force mode enabled: bypassing Rome time window check"
          else
            echo "→ Normal mode: will check Rome time window (10:30-11:00)"
            echo "→ To bypass time window, use workflow_dispatch with 'force: true'"
          fi
          
          # --allow-test: permette post di test/draft
          if [ "${{ github.event.inputs.allow_test }}" == "true" ]; then
            args="$args --allow-test"
            echo "→ Allow test posts enabled"
          fi
          
          # Esegui lo script
          echo "→ Running: node scripts/auto-post.mjs $args"
          node scripts/auto-post.mjs $args

      - name: Check if changes
        id: changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "has_changes=true"
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "has_changes=false"
          fi

      - name: Skip PR creation
        if: steps.changes.outputs.has_changes == 'false'
        run: |
          echo "Skipping PR creation: no changes detected"

      - name: Create Pull Request (DRAFT)
        if: steps.changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GH_PAT }}
          branch: ${{ steps.meta.outputs.branch }}
          base: main
          draft: true
          title: "Auto-post: Generated posts for ${{ steps.meta.outputs.today }}"
          body: |
            Auto-generated post via GitHub Actions.

            **⚠️ REVIEW REQUIRED BEFORE MERGE**

            Generated on: ${{ steps.meta.outputs.iso }}

            This PR is created as DRAFT to ensure review before merging to main.
          commit-message: "chore: auto-generate posts"
          delete-branch: true
