name: Auto Post Generation

on:
  schedule:
    # 10:35 Europe/Rome (09:35 UTC)
    - cron: '35 9 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Date (YYYY-MM-DD)'
        required: false
        type: string
      force:
        description: 'Force run (ignore time window)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: staging

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Detect package manager
        id: pkg-mgr
        run: |
          if [ -f "pnpm-lock.yaml" ]; then
            echo "manager=pnpm" >> $GITHUB_OUTPUT
            echo "install=pnpm install --frozen-lockfile" >> $GITHUB_OUTPUT
            echo "command=pnpm" >> $GITHUB_OUTPUT
          elif [ -f "yarn.lock" ]; then
            echo "manager=yarn" >> $GITHUB_OUTPUT
            echo "install=yarn install --frozen-lockfile" >> $GITHUB_OUTPUT
            echo "command=yarn" >> $GITHUB_OUTPUT
          else
            echo "manager=npm" >> $GITHUB_OUTPUT
            echo "install=npm ci" >> $GITHUB_OUTPUT
            echo "command=npm" >> $GITHUB_OUTPUT
          fi

      - name: Install dependencies
        run: ${{ steps.pkg-mgr.outputs.install }}

      - name: Run auto-post script
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL_DEFAULT: ${{ vars.OPENAI_MODEL_DEFAULT || 'gpt-5-mini' }}
          OPENAI_MAX_OUTPUT_TOKENS: ${{ vars.OPENAI_MAX_OUTPUT_TOKENS || '7000' }}
        run: |
          args=""
          if [ "${{ github.event.inputs.date }}" != "" ]; then
            args="--date ${{ github.event.inputs.date }}"
          fi
          if [ "${{ github.event.inputs.force }}" == "true" ]; then
            args="$args --force"
          fi
          node scripts/auto-post.mjs $args

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: auto-post/$(date +%Y%m%d-%H%M%S)
          base: main
          title: 'Auto-post: Generated posts for $(date +%Y-%m-%d)'
          body: |
            Auto-generated post via GitHub Actions.

            Generated on: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          commit-message: 'chore: auto-generate posts'
          delete-branch: true
