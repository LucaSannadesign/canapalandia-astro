name: Canapalandia Social Agent 6M

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/social-agent.yml'
  schedule:
    # Runs daily; the script enforces a 47h minimum between completed articles.
    # Daily polling also lets a failed single-channel publish retry the next day.
    - cron: '30 8 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Test selection and payload without publishing"
        required: true
        default: true
        type: boolean
      channels:
        description: "Comma-separated channels for this manual run"
        required: true
        default: "facebook,instagram"
        type: string

permissions:
  contents: read
  actions: write

concurrency:
  group: canapalandia-social-agent-6m
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Restore social state
        uses: actions/cache/restore@v4
        with:
          path: .cache/social-share.json
          key: social-share-cache-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            social-share-cache-

      - name: Normalize Make webhook URL
        env:
          RAW_MAKE_WEBHOOK_URL: ${{ secrets.SOCIAL_MAKE_WEBHOOK_URL }}
        run: |
          WEBHOOK_URL="$(printf '%s' "$RAW_MAKE_WEBHOOK_URL" | grep -oE 'https://hook\.[[:alnum:].-]+\.make\.com/[[:alnum:]_-]+' | head -n 1)"
          if [ -z "$WEBHOOK_URL" ]; then
            echo "SOCIAL_MAKE_WEBHOOK_URL does not contain a valid Make webhook URL" >&2
            exit 1
          fi
          echo "::add-mask::$WEBHOOK_URL"
          echo "MAKE_WEBHOOK_URL=$WEBHOOK_URL" >> "$GITHUB_ENV"

      - name: Run social agent
        env:
          RSS_URL: https://canapalandia.com/rss.xml
          STATE_FILE: .cache/social-share.json
          RECENT_POSTS_WINDOW_MONTHS: 6
          MIN_HOURS_BETWEEN_ARTICLES: ${{ github.event_name == 'push' && '0' || '47' }}
          SOCIAL_CHANNELS: ${{ github.event_name == 'push' && 'linkedin' || (github.event_name == 'workflow_dispatch' && inputs.channels || 'facebook,instagram') }}
          DRY_RUN: ${{ github.event_name == 'push' && 'false' || (github.event_name == 'workflow_dispatch' && inputs.dry_run || false) }}
        run: |
          mkdir -p .cache
          node scripts/social-agent.mjs

      - name: Save social state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/social-share.json
          key: social-share-cache-${{ github.run_id }}-${{ github.run_attempt }}
