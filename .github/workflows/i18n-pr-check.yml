name: i18n PR check

on:
  pull_request:
    branches: [main]
    paths:
      - "src/content/blog/**"
      - "src/components/**"
      - "src/pages/blog/**"
      - "src/lib/localization.ts"
      - "scripts/i18n-audit.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/i18n-pr-check.yml"

permissions:
  contents: read

concurrency:
  group: i18n-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  audit-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SITE: https://canapalandia.com
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Localization audit
        run: pnpm i18n:audit

      - name: Astro build
        run: pnpm build
