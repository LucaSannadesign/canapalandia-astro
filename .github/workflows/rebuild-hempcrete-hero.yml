name: Rebuild hempcrete hero

on:
  push:
    branches:
      - draft/can-260911-hempcrete
    paths:
      - '.tmp-hempcrete/READY'

permissions:
  contents: write

jobs:
  rebuild:
    if: github.event.head_commit.message != 'feat(content): replace hempcrete hero with compressed WebP'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: draft/can-260911-hempcrete
          fetch-depth: 0

      - name: Rebuild and verify image
        shell: bash
        run: |
          set -euo pipefail
          cat .tmp-hempcrete/part-*.b64 | tr -d '\n\r' | base64 -d > public/images/can-260911-hempcrete-hero.webp
          echo "1c3c3698bc1df9cc8021eeb0495c02b26e77c599f9a34013063928233b514baa  public/images/can-260911-hempcrete-hero.webp" | sha256sum -c -
          test "$(wc -c < public/images/can-260911-hempcrete-hero.webp)" -eq 51190

      - name: Commit final asset
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/can-260911-hempcrete-hero.webp
          git rm -r .tmp-hempcrete
          git commit -m "feat(content): replace hempcrete hero with compressed WebP"
          git push origin HEAD:draft/can-260911-hempcrete
